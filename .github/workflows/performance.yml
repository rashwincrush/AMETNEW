name: Performance Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Run nightly at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.49.0'

      - name: Run Smoke Test
        run: |
          cd k6
          k6 run --summary-trend-stats="avg,min,med,max,p(95),p(99)" smoke-test.js

  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    needs: smoke-test
    # Only run on schedule or manual trigger, not on every PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Load Test
        run: |
          cd k6
          k6 run load-test.js

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: k6/load-test-results.json
          retention-days: 7

  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    needs: smoke-test
    # Only run manually - this is intensive
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Stress Test
        run: |
          cd k6
          k6 run stress-test.js || true  # Don't fail, just gather data

  rpc-performance:
    name: RPC Functions Performance
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Test RPC Performance
        run: |
          cd k6
          k6 run rpc-functions-test.js

  compare-baseline:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    needs: [smoke-test, load-test]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Download Main Branch Results
        uses: dawidd6/action-download-artifact@v3
        with:
          branch: main
          name: load-test-results
          workflow: performance.yml
          if_no_artifact_found: ignore

      - name: Compare Performance
        run: |
          echo "Comparing performance metrics..."
          # This is a placeholder - implement actual comparison logic
          # You could use k6's JSON output and compare thresholds
