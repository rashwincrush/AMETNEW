| Layer        | Gaps Found                                                                                              | Severity | Immediate Fix |
|-------------|----------------------------------------------------------------------------------------------------------|----------|---------------|
| Product     | No single written “Admin Contract” aligning admin vs super_admin vs tenant_admin vs employer/admin.     | High     | Document role matrix and tie to code constants + SQL comments. |
| UX          | Inconsistent access-denied UX between ProtectedRoute, AdminGate, and component-level checks.            | Medium   | Standardize on AccessDenied with reason hints (role/feature/approval). |
| Frontend    | Some admin gating relies only on `requiredPermission="access:all"` without explicit `requireAdmin`.    | Medium   | Wrap all `/admin/*` in both `ProtectedRoute requireAdmin` and `AdminGate`. |
| Backend/API | `admin-invite-user` has no authorization checks; `set-role` relies fully on DB RPC policy.              | Critical | Add JWT validation + platform_admin/tenant_admin checks in both functions. |
| DB          | Last-super_admin guard is implemented only in `changeUserRole.js` (FE).                                  | High     | Add DB-level check in `admin_set_user_role` or dedicated guard function. |
| RLS         | Multitenancy RLS is strong for tenants/features, but some domain tables may not yet bind to tenant.     | High     | Ensure tenant_id + RLS policies exist for all admin-managed domain tables. |
| Security    | Edge Functions run with service role; abuse path exists if endpoints are not restricted.                | Critical | Enforce auth + role + tenant gating in Edge Functions + optional allowlist. |
| QA          | No automated matrix for route-level access by role/approval/tenant/feature.                             | Medium   | Add Cypress/RTL tests for each admin route for each role combination. |
| Architecture| `admin_set_user_role` used for both self-serve and admin flows; semantics can drift.                    | Medium   | Split into `user_self_set_role` and `admin_set_user_role` with distinct checks. |

3. PRODUCT MANAGER (PM) LOGIC MAP

- **Rules**
  - Registration: Only `alumni`, `student`, `employer` can be chosen in EnhancedRegister. Admin/super_admin are created via DB trigger (`elevate_platform_admin`) or via admin tools.
  - Profile: Users can edit their own profiles; role is not editable via Profile UI for safety.
  - Admin Panel: `/admin/*` routes are for campus admins and super_admins; `/admin/tenants*` is super_admin-only.
  - Directory: Employers cannot access; admin sees extra counts/filters but still respects RLS-backed RPCs.
  - Events/Jobs/Mentorship/Groups: Admins have enhanced create/manage capabilities (events:create, access:all, admin approvals).

- **Roles & Permissions**
  - Roles: `alumni`, `student`, `employer`, `admin`, `super_admin` (`AppRole` / app_role_enum).
  - Permissions: Defined in `BASE_PERMISSIONS` in AuthContext; admin & super_admin have `access:all`, plus some explicit keys.
  - Effective Permissions: `derivePermissions` adds approval-aware restrictions but leaves admin/super_admin with full base permissions.

- **JTBD (Jobs To Be Done)**
  - Campus Admin: Approve/reject users, manage mentors, moderate content, see analytics.
  - Platform Super Admin: Manage tenants, feature flags, platform-level settings.
  - Normal User: Never be confused by admin-only features or error states.

- **Success / Failure**
  - Success: Only admins see admin nav; platform/tenant configuration is safe; admins can complete all tasks from UI without SQL.
  - Failure: Any non-admin reaching `/admin/*` views or invoking admin RPCs; any cross-tenant leakage.

- **Flow Map (Entry → Goal → Exit)**
  - Registration → choose primaryRole → signUp → Edge `set-role` → profiles seed → Dashboard with correct base permissions.
  - Admin user management → Navigate `/admin/users` → filter/search → approve/reject/role-change → updated profiles + logs.
  - Super_admin tenants → `/admin/tenants` → view platform_tenants/tenants → manage features → safe RLS-consistent changes.

- **Constraints (Must / Should / Could)**
  - Must: Never expose platform_tenants or tenant_feature_flags to non-super_admins; never allow self-escalation beyond allowed roles.
  - Should: Make admin distinctions clear in UI (super_admin vs campus admin), surface tenant/feature flags in AdminSettings.
  - Could: Add fine-grained module admin roles (e.g., events_admin, mentorship_admin) backed by DB roles and RLS.

4. UX/UI AUDIT

- **User Journeys**
  - Admin entry: Mainly via nav items + routes guarded by ProtectedRoute/AdminGate.
  - Super_admin entry: `/admin/tenants` and related pages, further restricted by `isSuperAdmin` in AuthContext.

- **Flow Drop-offs**
  - If permissions mismatch (e.g., user has `access:all` but backend RLS denies), user sees generic toast/API error instead of a clear “Contact admin / feature not enabled / tenant misconfigured”.

- **Navigation**
  - Navigation component conditionally shows admin items; requires consistent use of `isAdminLike`/role.
  - Risk: Newly added admin components might be linked directly in non-admin contexts without gating.

- **Back/Cancel/Reset**
  - Forms (registration, profile, admin modals) largely offer cancel/close; for admin-specific flows, ensure confirm dialogs for destructive actions like hard delete or role change.

- **CTAs and Screens Needed**
  - Need explicit “Platform Settings/Tenants” screen with clear “You are platform admin” message.
  - Need a dedicated “Admin Permissions Explained” info block for future admins.

- **UI State Completeness**
  - ProtectedRoute has proper loading screen.
  - Admin components generally show loading/empty/error states, but not always with access-denied reason; unify patterns.

- **Cognitive Load**
  - Many admin tools in one navigation cluster; consider tabbing/sections inside AdminSettings.

- **Accessibility**
  - Uses buttons/inputs with labels; ensure ARIA roles on admin tables and modals (especially UserManagement filters & bulk actions).

- **Mobile-first**
  - Most admin screens are more desktop-oriented; acceptable for v1, but ensure pages don’t break on narrow widths (tables need responsive wrappers).

5. FRONTEND ENGINEERING AUDIT

- **Role & Permission Handling**
  - Single source for roles: `lib/roles(.ts|.js)` + `AuthContext` BASE_PERMISSIONS.
  - `ProtectedRoute` supports `requireAdmin`, `allowRoles`, `requiredPermission`, `isSuperAdminOnly`.
  - `AdminGate` additionally enforces admin-role on some analytics routes.

- **Unsafe Writes / Direct Role Edits**
  - Profile and registration never allow arbitrary role changes beyond `alumni|student|employer` at sign-up.
  - Role changes are centralized in `changeUserRole.js`, which calls RPC `admin_set_user_role` and enforces a last-super_admin guard **on the client**.

- **State / Effect Risks**
  - Admin pages use standard React hooks; watch for dependency lists when using `getUserRole()` in `useEffect`, but current usage seems stable.

- **API Misuse**
  - Most admin flows use Supabase JS with RLS; but any call using `rpc('admin_set_user_role')` must assume backend enforces admin-only.

- **Realtime / Staleness**
  - Directory and mentorship modules have realtime hooks; admin changes (e.g. approvals) should propagate; ensure admin panel also refetches after mutations.

- **UI States**
  - `ProtectedRoute` has proper loading + AccessDenied states; some admin components rely on their own `loading`/`error` toasts; standardization recommended.

6. BACKEND/API AUDIT

- **Edge Function: set-role**
  - Auth: Validates Bearer token and calls `supabaseAdmin.auth.getUser(jwt)`.
  - Logic: Only allows roles in {alumni, student, employer}. Calls `admin_set_user_role` with `{ user_id: userId, role }` using service role.
  - Risk: Depends entirely on DB function to ensure user_id == auth.uid() / no cross-user changes.

- **Edge Function: admin-invite-user**
  - Auth: **None** beyond comment; any caller can POST email + metadata and trigger an invite using service role.
  - Risk: High – open abuse channel: spam invites, user enumeration, platform abuse.
  - Fix: Require Authorization JWT and check `is_platform_admin()` or tenant_admin role before inviting; optionally restrict origin.

- **Admin RPC: admin_set_user_role (assumed)**
  - Used by both `set-role` and `changeUserRole`.
  - Risk: Overloaded semantics; must differentiate self-service vs admin-initiated changes in function body.
  - Fix: Split into two functions or add explicit `caller_is_admin` checks using `auth.jwt()` claims.

- **Error Codes**
  - `set-role` returns 400/401/403/500 appropriately.
  - `admin-invite-user` returns 400/500 with JSON body; add 401/403 for unauthorized.

7. DATABASE + SUPABASE RLS SCAN

- **NOT NULL / Integrity**
  - Multitenancy tables have clear PKs and FK constraints (tenants, tenant_members, platform_tenants, tenant_feature_flags).

- **RLS & Ownership**
  - `tenants`, `tenant_members`, `features`, `tenant_feature_flags`, `platform_tenants` all enable RLS with platform_admin policies.
  - `platform_admin_emails` + trigger elevate platform_admin ensure configured emails become `super_admin`.

- **Admin Bypass & Last Super Admin**
  - Profiles trigger sets role=super_admin + is_admin=true when email in allowlist.
  - No visible DB-level check yet to prevent demoting the last super_admin; only frontend helper counts them.

- **Multitenant Isolation**
  - Tenants and tenant_members are isolated; but all domain tables (events, jobs, messages, groups, mentorship, directory) must carry tenant_id and have RLS; verify in schema migrations before making stronger assumptions.

8. SECURITY & ABUSE ANALYSIS

- **Top Threats**
  - Anonymous abuse of `admin-invite-user` Edge Function.
  - Potential misuse of `admin_set_user_role` if DB policy not strictly tied to auth.uid/role.
  - Frontend-only last_super_admin safeguard bypassable via direct RPC/SQL.
  - Admin UI surfacing more information than RLS-allowed if backend is misconfigured.

- **Mitigations**
  - Add strong auth+role checks to `admin-invite-user` and `set-role` (platform_admin or tenant_admin for that tenant).
  - Add DB-level `CHECK` or custom function to prevent demoting the last super_admin.
  - Ensure all admin RPCs/views check tenant_id + role.

- **Early Warning Signals**
  - Sudden spike in invite emails from unknown IPs/origins.
  - Logs showing `admin_set_user_role` being called for many users in short time.
  - 403/401 spikes on admin RPCs indicating brute-force or scanning.

- **Storage/Auth/Session Pitfalls**
  - Service role keys must never leak to frontend; current FE uses only anon key (good).
  - JWT claims must include role and tenant context for future RLS decisions.

9. QA / SDET EDGE CASE SWEEP

- **Scenarios to Test**
  - New user (alumni/student/employer) hitting `/admin/*` → must see AccessDenied.
  - Half-approved user: ensure `derivePermissions` restricts access but admin flows still can approve them.
  - Blocked/rejected users: redirected consistently to RejectionPage; ensure no admin nav.
  - Admin vs super_admin: test `/admin/tenants*` is accessible only by super_admin.
  - Mobile view: admin nav collapses correctly; no overlap with profile/directory CTAs.
  - Slow network / expired token: admin pages must gracefully handle 401 + redirect to login.
  - Empty data: admin lists should show explicit empty states, not generic errors.
  - API failures: simulate 500s on admin RPCs and ensure toasts + non-destructive rollback.

10. ARCHITECTURE & SRE REVIEW

- **Bottlenecks & Coupling**
  - `AuthContext` couples permissions, roles, and approval logic; any change there hits all modules.
  - Edge Functions use a shared service role client; any misconfig affects all.

- **Future Modularity Risks**
  - Using one RPC (`admin_set_user_role`) for many purposes couples self-service and admin-service flows.
  - Admin routes share one `access:all` permission; more fine-grained module-specific permissions may be needed later.

- **Autoscaling / Logging**
  - Edge Functions should log admin actions (invites, role changes) with minimal PII.
  - Consider log-based alerts when certain thresholds on admin actions are exceeded.

- **Cache Invalidation & Crash Loops**
  - QueryClient is configured with 5–10 minute caches; admin actions may stale directory/mentorship/job state. Use refetches on mutation success.

- **Backup/Restore**
  - Multitenant tables and admin configuration must be covered by regular Supabase backups; ensure platform_admin_emails also backed up.

11. SECURITY / PRIVACY / COMPLIANCE AUDIT

- **Access Control Gaps**
  - `admin-invite-user` missing any role check.
  - Last-super_admin protection not enforced server-side.

- **Data Exposure**
  - Directory shows extra role-based counts only to admins; safe as long as RPC/RLS ensure aggregate-only for others.

- **Storage Permissions**
  - Tenants and platform_tenants RLS is properly guarded by `is_platform_admin()`; ensure S3/Storage buckets for admin exports are also tenant/repo-scoped.

- **Token Handling**
  - Edge Functions correctly expect Bearer tokens, but only `set-role` enforces them; `admin-invite-user` does not.

- **GDPR / India DPDP 2023**
  - Admin tools must respect right to erasure and export; ensure delete/purge flows are logged and possibly soft-deleted with retention policies.

- **Logging**
  - Avoid logging full JWTs or sensitive PII; current Edge Functions only log errors and not payloads (good), but confirm across all functions.

12. FIX LIST: SHIP / DON’T SHIP GATE

- **Must Fix Before Broad Production**
  - Add strict auth + role checks to `admin-invite-user` (require platform_admin or tenant_admin, and possibly HMAC/shared secret for server-to-server only).
  - Add DB-level last-super_admin protection inside `admin_set_user_role` (or new `admin_guard_last_super_admin` function) so no caller can demote the last super_admin.
  - Audit `admin_set_user_role` implementation to ensure self-service calls can only change own role among allowed subset, and admin calls require admin role.
  - Ensure all `/admin/*` routes are wrapped with `ProtectedRoute requireAdmin` and, where applicable, super_admin checks.
  - Verify tenant_id + RLS policies for all admin-managed tables (events, jobs, groups, mentorship, directory views), especially in multitenant mode.

- **Should Fix Soon After**
  - Standardize AccessDenied UX with clear messages based on role/feature/approval.
  - Add end-to-end tests for each admin route for roles: alumni, student, employer, admin, super_admin.
  - Introduce structured logging for all admin-critical mutations (invites, role changes, tenant feature toggles).

- **Could Fix / Enhancements**
  - Introduce per-module admin permissions (events_admin, jobs_admin, mentorship_admin) and wire them into BASE_PERMISSIONS + RLS.
  - Add an “Admin Debug Panel” overlay to show why a user is / isn’t allowed to see a page (role, approvals, feature flags, tenant).

- **Ship / Don’t Ship**
  - **Don’t Ship to broad production** until Edge Functions and DB-level role-guarding are hardened and tested.
  - **Limited pilot OK** under close monitoring if you accept the current risk and restrict access to known, trusted admins.

