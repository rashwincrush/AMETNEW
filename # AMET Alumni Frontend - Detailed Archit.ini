### 6. BACKEND/API AUDIT – STUDENT ROLE (ASSUMPTIVE, TO BE VERIFIED IN SQL/RPC CODE)

**Where students hit the backend**

- **Registration**  
  - `supabase.auth.signUp` with `options.data` containing `role: 'student'`, degree, department, expected grad year, student ID.  
  - Backend triggers should sync to `public.profiles` and enforce allowed roles.

- **Profile updates**  
  - `.from('profiles').update(payload).eq('id', user.id)` calls.  
  - Must be protected so that a student cannot update someone else’s profile even if they tamper with payload.

- **Groups**  
  - Join/leave via RPCs or direct table operations (`joinGroup`, `leaveGroup` helpers).  
  - Alumni-only restriction is enforced in FE; must *also* be baked into RLS/RPC logic.

- **Events**  
  - Student event creation is hidden in FE; BE must reject event inserts when `role = 'student'`.  
  - Event registration (RSVP) must ensure only eligible students can register for restricted events.

- **Job Portal**  
  - Students create job applications; employers create job posts.  
  - APIs must enforce these distinctions by role, not just trust UI.

- **Messaging**  
  - RPCs that ensure conversation participants; must ensure students can only read/write messages in threads they are part of.

- **Mentorship**  
  - RPCs for mentorship request creation (`useCreateMentorshipRequest`) and acceptance/rejection/cancel; these must check:  
    - Mentor/mentee IDs correspond to `auth.uid()` or allowed relationships.  
    - Mentee is eligible (approved student or alumni-mentee).  
    - No ability to mass-create requests for arbitrary mentee IDs.

**API / error semantics**

- Ensure standardized status codes:  
  - `400` invalid payload (e.g., invalid degree code).  
  - `401` unauthenticated.  
  - `403` role/approval forbidden (student trying to create event).  
  - `409` conflict (duplicate mentorship request or job application).  
  - `500` unexpected.

**Immediate backend actions**

1. Review all RPCs and function definitions that reference `student`, `mentee_id`, `user_id`, or `role`.  
2. Confirm every mutating operation verifies `auth.uid()` is the actor and uses role restrictions in logic.  
3. Add explicit `IF current_role = 'student' THEN RAISE EXCEPTION ...` where needed (e.g., event creation) to prevent misuse even in admin UI mistakes.

