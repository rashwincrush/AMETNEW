1. MULTI-PERSONA DEEP SCAN (14+ LENSES)

For each role: what they see → what breaks → concerns → must-not-fail rules.

- **Product Manager**  
  See: Single `AlumniDashboard` used for all roles, Alumni permissions derived from `AuthContext` → `BASE_PERMISSIONS.alumni`, and `ProtectedRoute` gates on strings like `view:alumni_directory`, `access:events`, `request:mentorship`.  
  Breaks: Any mismatch between approval state and FE permission set will allow pending/rejected Alumni to browse or act where RLS/API say “no”; silent 403s turn into “empty state” confusion.  
  Concerns: No clear, human-readable map of “Alumni can/cannot do X in state Y (pending/approved/rejected)”.  
  Must-not-fail: Alumni must always (a) see a usable Dashboard, (b) know their approval state, (c) access allowed features and be gently blocked from disallowed ones.

- **Business Expert**  
  See: Alumni drive core value: directory density, mentoring, referrals, employer introductions, and activity in events/groups.  
  Breaks: If Alumni can’t quickly see jobs, events, or mentorship options, business KPIs tank; if they can spam or bypass approvals, brand and trust suffer.  
  Concerns: Weak anti-abuse for messaging/mentorship, plus unclear segmentation (Alumni vs Employer vs Student) → poor analytics on Alumni-specific ROI.  
  Must-not-fail: No Alumni data leaks, no harassment tolerated, and conversion from signup → approved Alumni → engaged mentor/participant.

- **UX Designer**  
  See: Router centralizes flows (`/dashboard`, `/directory`, `/events`, `/jobs`, `/groups/*`, `/messages`, `/mentorship`), with `RequireCompleteProfile`, `ProtectedRoute`, and `FeatureGuard` scattered across routes.  
  Breaks: Alumni in “pending” or “rejected” states see routes that appear accessible but result in access-denied, no-data, or confusing redirects.  
  Concerns: Missing explicit banners for approval state; friction between multi-step registration and later Profile Settings; partial states (e.g., alumni can browse directory but not message).  
  Must-not-fail: Clear guidance on “what’s next” at every screen, especially for Alumni who just registered or are partially approved.

- **UX Writer**  
  See: Toasts and errors (e.g., registration, degree validation, profile saves) plus AccessDenied/FeatureGuard copy.  
  Breaks: Inconsistent error language between FE validation vs Supabase errors; RLS 403s can bubble as generic technical messages.  
  Concerns: Alumni don’t understand *why* they can’t access jobs/directory/mentorship or what steps to take.  
  Must-not-fail: Consistent wording that ties permissions to role + approval + tenant; no raw DB or auth jargon surfaced.

- **Frontend Lead**  
  See: `AuthContext` holds `BASE_PERMISSIONS`, `derivePermissions()`, `getUserRole()`, and approval flags; routes use `ProtectedRoute requiredPermission`. Mentorship, directory, jobs, events, groups, messaging all reference these permissions.  
  Breaks: If `BASE_PERMISSIONS.alumni` or pending-logic in `derivePermissions` is changed without updating RLS or RPCs, Alumni either get weird 403s or unintended access.  
  Concerns: Permissions are stringly-typed with no central enum or compile-time checks; Alumni “view-only” vs “action” capabilities are not systematically expressed (read vs write).  
  Must-not-fail: Any change to Alumni capabilities should be a one-line diff in a central role/permission config, mirrored in server/RLS.

- **Backend/API Lead**  
  See: Supabase RPCs and triggers for directory (`get_directory_profiles_secure`), groups, messaging, mentorship; serverless function `set-role` used post-registration to align JWT claims with `profiles.role`.  
  Breaks: If RPCs do not re-check role/ownership/tenant based on JWT, Alumni could call them with wrong context or outdated tokens.  
  Concerns: Divergence between FE-perceived role and DB/RLS claims, plus lack of consistent error codes (400 vs 401 vs 403 vs 409).  
  Must-not-fail: Every Alumni-sensitive endpoint must enforce auth, role, tenant, and approval status *server-side* irrespective of FE gating.

- **DB/Supabase/Postgres Architect**  
  See: `public.profiles` as identity + role + academic/employment fields, relationship tables (connections, mentorship_*), job/events tables, and RLS-based access.  
  Breaks: Missing composite unique constraints (e.g., duplicate mentorship requests), weak foreign keys (or none), or per-table RLS mismatches for Alumni vs other roles.  
  Concerns: `role` and `tenant_id` not consistently indexed or enforced; RLS policies too broad or missing for join tables; insufficient coverage for Alumni acting as both mentee and mentor.  
  Must-not-fail: No Alumni row can see or mutate rows for another tenant or user; RLS must encode role + ownership + approval, not just user_id.

- **RLS/Security Engineer**  
  See: JWT-based role claims (`role`), multi-tenant patterns, and RLS for `profiles`, directory views, mentorship, groups, jobs, messaging.  
  Breaks: If RLS only checks `user_id` and not role/approval/tenant, Alumni might escalate capabilities via FE glitches or token reuse.  
  Concerns: “Last super_admin” safety, cross-tenant RLS holes, abuse via messaging/mentorship, and open redirects or enum leaks in public endpoints.  
  Must-not-fail: Alumni can never change their own role or approval, never act as employer or admin, and cannot see hidden profiles or other tenants.

- **QA SDET**  
  See: Complex matrix of states (new Alumni, pending, approved, rejected, cross-tenant, mentor or mentee roles, messaging & groups & jobs & events).  
  Breaks: Lack of automated tests on flows like “Alumni pending → profile completion → admin approval → mentorship available” leads to regressions.  
  Concerns: No unified test suite that runs through the full Alumni journey from registration to mentoring & group participation; insufficient coverage for error/empty states.  
  Must-not-fail: Every release should pass scenario tests defined in Section 9.

- **AppSec Analyst**  
