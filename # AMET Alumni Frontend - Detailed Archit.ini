3. PRODUCT MANAGER (PM) LOGIC MAP

**Core Alumni JTBDs**
- **JTBD-A1**: As an Alumni, I want to register and prove my identity so I can access my alumni network safely.
- **JTBD-A2**: As an Alumni, I want to maintain a rich profile so peers, students, and employers understand my background.
- **JTBD-A3**: As an Alumni, I want to explore and apply for jobs relevant to my skills and batch.
- **JTBD-A4**: As an Alumni, I want to attend events and reunions to stay connected.
- **JTBD-A5**: As an Alumni, I want to discover and join groups and communities where I belong.
- **JTBD-A6**: As an Alumni, I want to chat with peers, students, and sometimes employers in a safe, non-spammy way.
- **JTBD-A7**: As an Alumni, I want to offer or receive mentorship in a structured, low-friction way.

**Entry → Goal → Exit Flows (Alumni)**

- **Registration & Approval**  
  Entry: `/register` → select role (defaults to Alumni if invalid) → form step 2 collects core profile data and degree/department.  
  Goal: Create Supabase auth user + `profiles` row with `role = 'alumni'`, correct `degree_code`, `department_id`, and academic/employment info.  
  Exit: Email verification or immediate session, plus potential admin approval step. FE: `EnhancedRegister.handleSubmit` calls `supabase.auth.signUp`, upserts `profiles`, seeds `social_links`, and calls `set-role` function.

- **Profile Settings**  
  Entry: `/profile` (guarded by `access:profile_settings`).  
  Goal: Let Alumni view and edit all fields captured during registration plus additional optional ones.  
  Exit: Saved, validated changes persisted to `profiles` and auxiliary tables (e.g., `social_links`), with consistent view in directory and mentorship.

- **User Management Process (Admin perspective)**  
  Entry: `/admin/users` and dedicated role management / mentor approval pages.  
  Goal: Approve or reject Alumni, change roles safely (alumni ↔ student/employer only with justification).  
  Exit: Alumni’s effective permissions and JWT claims match admin decisions.

- **Alumni Directory**  
  Entry: `/directory` and `/profile/:userId`.  
  Goal: Browse and connect with Alumni using role-aware filters, secure counts, and connection actions.  
  Exit: Successful connection request, profile view, or action taken (message/mentorship) within allowed permissions.

- **Events**  
  Entry: `/events/*`.  
  Goal: Alumni can discover, RSVP, and manage their event participation; admins manage events.  
  Exit: RSVP recorded; upcoming events highlighted on dashboard; My Registrations works reliably.

- **Job Portal**  
  Entry: `/jobs`, `/jobs/:jobId`, `/jobs/:jobId/apply`, etc.  
  Goal: Alumni can browse, filter, and apply to jobs; employers post and manage jobs.  
  Exit: Applications recorded; Alumni can track status via `/jobs/applications` or `/my-applications`.

- **Groups**  
  Entry: `/groups/*` (except employers redirected to /events).  
  Goal: Alumni can browse, join, and participate in groups, and selected Alumni can administer specific groups.  
  Exit: Membership stored via triggers / join tables; groups show relevant membership counts and content.

- **Messaging**  
  Entry: `/messages` guarded by `message:users`.  
  Goal: Alumni can message other users, respecting connection and mentorship rules.  
  Exit: Messages delivered and visible in conversation list; no unauthorized conversations.

- **Mentorship**  
  Entry: `/mentorship` with tabs for find/requests/settings, plus helper routes for become-mentor, etc.  
  Goal: Alumni act as mentee, mentor, or both; requests flow through approval and relationships.  
  Exit: Accepted mentorships, closed loop on requests, and safe termination.

**Constraints & Priorities (Must/Should/Could)**

| Constraint / Rule                                                                | Priority |
|-----------------------------------------------------------------------------------|----------|
| Alumni cannot self-assign to employer/admin roles or modify approval status.      | MUST     |
| Alumni actions must be scoped by tenant and RLS at DB level.                      | MUST     |
| Pending Alumni have read-only or limited access across jobs/events/directory.     | MUST     |
| Rejected Alumni are redirected and cannot access core modules.                    | MUST     |
| Mentorship/inbox flows rate-limited and abuse-monitored.                          | MUST     |
| Alumni can easily see and edit all profile fields captured at registration.       | SHOULD   |
| Alumni directory chips and counts are role-aware and non-leaky.                   | SHOULD   |
| In-app explanations for every denied Alumni action (not just generic error).      | SHOULD   |
| Advanced filters and analytics for Alumni behavior per tenant.                    | COULD    |
| Dark-mode and mobile-optimized Alumni dashboard.                                  | COULD    |

---

4. UX/UI AUDIT (ALUMNI FOCUS)

**User Journeys & Flow Drop-Off Risks**

- Registration → Dashboard  
  - Strong: Multi-step `EnhancedRegister` collects key Alumni data in one go.  
  - Risk: If email confirmation or approval status is required, Alumni may not understand why they see limited modules (directory visible but messaging disabled).  
  - Fix: Add "Account pending approval" and "Email confirmation required" banners with clear CTAs.

- Profile Settings  
  - Strong: Uses `RequireCompleteProfile` and `ProtectedRoute` to ensure core identity.  
  - Risk: If any registration-captured fields are not visible/editable in profile, Alumni feel data is stuck (per global frontend rule).  
  - Fix: Review mapping between registration fields and profile form; ensure parity.

- Directory  
  - Strong: Uses secure RPC (`useDirectorySecure`) and role-aware chip counts (`useRoleCounts`). Alumni do not see student/employer counts.  
  - Risk: For Alumni with no connections, empty states may be confusing (“no results” vs “no permission”).  
  - Fix: Add tailored empty states for: (a) no search results, (b) no connections, (c) disabled actions (messaging/mentorship due to pending state).

- Events  
  - Strong: Dedicated `/events/my-registrations`, plus dashboard cards.  
  - Risk: For Alumni, events may look identical to student view; differences (e.g., Alumni-specific events) not obvious.  
  - Fix: Add tags/labels for Alumni-only vs mixed events; highlight upcoming alumni-specific events on dashboard.

- Job Portal  
  - Strong: `ProtectedRoute` gates: Alumni have `view:jobs` and `apply:jobs`. Employers have posting/management.  
  - Risk: Alumni may reach `/jobs/:jobId/apply` from external link while not approved or not logged in.  
  - Fix: Ensure nice login/approval gating for deep links; explain if they must complete profile/approval first.

- Groups  
  - Strong: `getUserRole() === 'employer'` redirected from `/groups/*` to `/events`, so Alumni-centric groups UX.  
  - Risk: Group admin flows (for Alumni group leaders) may be hidden or confusing; no clear distinction between member and admin surfaces in UI.  
  - Fix: Add lightweight admin badges and clear entry to manage view for group admins.

- Messaging  
  - Strong: Feature-flagged with `FeatureGuard featureKey="messages"` and permission `message:users`.  
  - Risk: No visible rate-limit or anti-spam cues; blocked messages appear like technical errors.  
  - Fix: Provide explicit copy when Alumni reach messaging limits or when recipient settings disallow messages.

- Mentorship  
  - Strong: Canonical `/mentorship` hub with query-param based sub-views; `useMentorshipRoleContext` differentiates Alumni vs students.  
  - Risk: Alumni acting as both mentor and mentee see complex states; unclear if they are "approved as mentor" vs "approved as mentee".  
  - Fix: Separate and visually label "Your Mentor Profile" vs "Your Mentee Requests"; show approval badges.

**Navigation, Back/Cancel/Reset**
- Ensure every Alumni-critical flow (registration, job application, mentorship settings) has explicit back/cancel and doesn’t trap users after errors.
- Confirm mobile nav allows quick access to directory, jobs, events, and mentorship with minimal taps.

**Accessibility & Mobile-First**
- Audit color contrast for chips, badges, and status indicators, especially for Alumni statuses (pending/approved/rejected).  
- Ensure keyboard focus and screen-reader labels for key CTAs like "Apply", "Connect", "Message", and "Request Mentorship".

---

5. FRONTEND ENGINEERING AUDIT

**Permissions & Role Handling**
- `AuthContext.BASE_PERMISSIONS.alumni` defines Alumni abilities: jobs, events, directory, mentorship, groups, messaging, profile settings.  
- `derivePermissions()` grants a reduced set for pending Alumni (dashboard, profile settings, read-only listings).  
  - Good: Pending logic is explicit for `student` and `alumni`.  
  - Risk: Any future Alumni-only feature may forget to add permissions for both approved and pending states.

Recommendations:
- Introduce a **typed permission enum** or central map (e.g., `PERMISSIONS.ALUMNI.VIEW_DIRECTORY`) imported by both `AuthContext` and route components.
- Add unit tests that assert: Alumni in each approval state can/cannot access each major route.

**Unsafe Writes & Direct Role Edits**
- `EnhancedRegister` writes `role` inside metadata and profile payload. It also calls `set-role` edge function with `role: selectedRole`.  
- Admin Role Management uses `changeUserRole` RPC and validates `isRole(newRole)`.  
Risk: Any frontend `.from('profiles').update({ role: ... })` would be unsafe; ensure no such call exists (grep check recommended).

**State & Effects**
- `AppContent` manages redirects for login and rejection; uses `getUserRole()` for directory/groups gating.  
- Potential risk: If `getUserRole()` or `profile.role` is stale after `set-role`, FE may momentarily render wrong UI.  
Recommendation: After role changes, always refresh session + profile and show a brief "updating access" spinner.

**Realtime / Staleness**
- Recent Activity, mentorship, and profiles rely on Supabase realtime hooks and React Query caching.  
Risk: Alumni toggling mentorship availability or group membership might not see immediate updates if cache invalidation is incomplete.  
Recommendation: Standardize hooks (`useMyProfile`, `useProfileById`, `useMentorshipRoleContext`, `useDirectorySecure`) to expose explicit `refetch` hooks and call them on critical actions.

**UI States (Loading/Empty/Error/Retry)**
- Many components already show loading placeholders, but Alumni-flows must be checked to ensure:  
  - Directory: clear “no results” vs “error loading directory” vs “no permission”.  
  - Jobs: empty jobs vs filtering mismatch vs 403/500 errors.  
  - Mentorship: separate “no mentors available” vs “you are not yet approved for mentorship”.

---

6. BACKEND/API AUDIT

ASSUMPTION: Backend uses Supabase RPCs and SQL functions for directory (`get_directory_profiles_secure`), role changes (`change_user_role`), mentorship life cycle, messaging, and group membership, with RLS enforcing core constraints.

**Key Checks for Alumni Flows (Must Be Enforced Server-Side)**

- **Registration / set-role**  
  - Validate: `set-role` must ensure the caller can *only* set their own role to allowed options (alumni/student/employer) and never escalate to `admin` or `super_admin`.  
  - Ensure: Only admins can promote/demote roles through a separate RPC that checks admin privileges and last-super-admin safety.

- **Directory RPC**  
  - Must filter by `tenant_id` and RLS; Alumni should never see other tenants.  
  - Must apply approval logic: hide restricted profiles or show redacted data for non-approved Alumni or non-approved profiles.

- **Jobs & Applications**  
  - Alumni job application endpoints must check `auth.uid() = applicant_id` and `tenant_id`.  
  - Employers posting jobs must have employer approvals; Alumni should never be allowed to post jobs, even if they tamper with FE.

- **Events**  
  - Event RSVP endpoints must validate user identity and tenant; Alumni cannot RSVP on behalf of others.  
  - Admin-only actions (create/edit/delete events) require `role in (admin, super_admin)` or equivalent claim.

- **Groups**  
  - Group membership inserts must rely on triggers that derive `user_id` from JWT; Alumni cannot insert arbitrary combinations.  
  - Group admin privileges (managing group members, editing group metadata) must be keyed by dedicated roles/ownership fields.

- **Messaging & Mentorship**  
  - Conversation creation and message sending endpoints must check that participants are allowed (e.g., blocked states, relationship preconditions, tenant, role).  
  - Mentorship requests must enforce: a mentee cannot request self; duplicates prevented; status transitions valid.

**Error Codes & Consistency**
- Standardize Alumni-facing APIs to use:  
  - `400 Bad Request` for invalid input,  
  - `401 Unauthorized` when no or invalid token,  
  - `403 Forbidden` when Alumni lack permission (role/approval/tenant),  
  - `409 Conflict` for duplicates (e.g., existing connection or mentorship request),  
  - `500` for unexpected server errors.

---

7. DATABASE + SUPABASE RLS SCAN

ASSUMPTION: Tables include `profiles`, `connections`, `event_rsvps`, `jobs`, `job_applications`, `groups`, `group_members`, `mentorship_requests`, `mentorship_relationships`, `messages`, and various audit/activity logs.

**Integrity & Constraints (Alumni-Critical)**

- **Profiles**  
  - Ensure: `id` PK, `role` constrained to `('alumni','student','employer','admin','super_admin')`, `tenant_id` NOT NULL for tenant-scoped installs, `email` unique per tenant.  
  - Alumni-specific: `graduation_year`, `degree_code`, `department_id` with FK to canonical catalogs.

- **Connections**  
  - Constraint: `UNIQUE (tenant_id, requester_id, recipient_id)` with symmetrical or canonical ordering to avoid duplicates.  
  - Check: `requester_id <> recipient_id` and `status` in ENUM.

- **Mentorship**  
  - `mentorship_requests`: `UNIQUE (tenant_id, mentee_id, mentor_id, status IN ('pending','active'))` to avoid spamming duplicates.  
  - `mentorship_relationships`: `UNIQUE (tenant_id, mentee_id, mentor_id)` and `CHECK (status IN ('active','closed'))`.

- **Groups & Members**  
  - `group_members`: `UNIQUE (tenant_id, group_id, user_id)`; `role` limited to set (member, admin, owner).  
  - Alumni-specific: no column that allows Alumni to designate themselves as group-level admin without admin approval.

- **Jobs and Applications**  
  - `job_applications`: `UNIQUE (tenant_id, job_id, applicant_id)`; FKs ensure `job_id` and `applicant_id` exist and share `tenant_id`.

**RLS Policies (Alumni)**

For each table, RLS should follow the pattern:
- `USING (tenant_id = current_setting('app.tenant_id')::uuid AND <role-specific conditions>)`
- `WITH CHECK` ensures Alumni cannot insert/modify rows outside their allowed scope.

Examples:
- `profiles`: Alumni can `SELECT` only approved public fields of other Alumni/roles in same tenant; only `UPDATE` their own row (excluding role/approval fields).  
- `connections`: Alumni can view connections where they are participant; can insert/delete only for themselves.  
- `mentorship_requests`: Alumni can create requests where `mentee_id = auth.uid()`; mentors can see and act on requests addressed to them; admins can view across tenant.  
- `group_members`: Alumni can see memberships for groups they belong to; cannot assign themselves admin roles.

**Last Super Admin Safeguard**
- Ensure DB-level constraint or guard in role-changing RPC: there must always be at least one `super_admin` per tenant (or globally, per design). Alumni role changes should never reach this path.

---

8. SECURITY & ABUSE ANALYSIS (ALUMNI)

**Top Threats & Exploits**
- **IDOR in profiles/directory**: Alumni could attempt to fetch profiles by ID or query raw tables bypassing RPC constraints.  
- **Messaging/Mentorship Harassment**: Alumni might spam messages or mentorship requests (especially towards students).  
- **Cross-Tenant Leaks**: Misconfigured RLS or RPCs may expose Alumni from another tenant.  
- **Role Escalation**: Alumni tries to change their role or impersonate admin/employer by calling `set-role` or admin RPCs.  
- **Data Scraping**: Alumni or bots scrape directory/job listings at scale.

**Mitigations**
- Strict RLS and RPC checks as outlined above (tenant + role + approval).  
- Per-tenant and per-user rate limits (via DB or API gateway) for: messaging, mentorship requests, connection requests, job applications, and RSVPs.  
- Audit logging of sensitive actions (role changes, approvals, blocked users, mass actions).  
- No direct exposure of Supabase service keys on FE; JWT tokens handled securely.

**Early Warning Signals**
- Sudden spikes in messages or mentorship requests from a single Alumni or IP.  
- High rate of 403 or 429 responses from Alumni endpoints.  
- Many failed attempts to access admin/tenant endpoints from Alumni accounts.

---

9. QA / SDET EDGE CASE SWEEP (ALUMNI SCENARIOS)

Build automated tests (e2e + integration) for:

- **New Alumni**: Register as Alumni → verify correct role + minimal permissions → ensure 403s correctly mapped to guidance for jobs/events/directory/mentorship where needed.
- **Pending Alumni**: Confirm read-only access to directory, jobs list, and events; blocked from messaging, mentorship actions, and group creation; UI clearly marks pending.
- **Approved Alumni**: Full flow tests for: update profile → apply to job → RSVP to event → join group → send message → send mentorship request → accept mentorship as mentor.
- **Rejected Alumni**: Confirm forced redirect to `/rejection` and no access to core modules.
- **Role Demotion/Change**: Alumni switched to student/employer; ensure FE and DB reflect; session refreshed; no leftover permissions.
- **Cross-Tenant**: Alumni from Tenant A must never access data from Tenant B via directory, groups, messaging, or mentorship.
- **Slow Network / Offline**: Ensure registration, job application, and mentorship requests handle timeouts, retries, and offline UI states gracefully.

