- **Novice User (Alumni)**  
  See: Registration (`/register` with `EnhancedRegister`), email confirmation, initial dashboard, then directory, events, jobs, groups, messaging, mentorship.  
  Breaks: Any missing explanation about pending/approval or access denied leads to churn.  
