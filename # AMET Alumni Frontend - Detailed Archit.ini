Why Now → Multitenancy and God-mode migrations are in place, and the app is production-like; any role leak or invite/role-elevation bug is now a serious risk.
Solution → Normalize admin behavior around app_role_enum + BASE_PERMISSIONS, ProtectedRoute, AdminGate, Admin-only RPCs, and strict RLS/tenant policies, with explicit last-super_admin safeguards in DB.
Architecture → React SPA with AuthContext-derived role + permissions, feature flags via TenantProvider + features/tenant_feature_flags, and Supabase Postgres with RLS and Edge Functions (set-role, admin-invite-user, admin_set_user_role, multitenancy_*).
Value → Predictable admin UX, safer tenant isolation, fewer accidental leaks in directory/jobs/events, and a clean foundation for further admin tooling (analytics, content moderation, approvals).
Risks → Edge Function `admin-invite-user` is currently unauthenticated, last_super_admin protection is frontend-only, and some admin gates rely only on `access:all` without double-checking role in backend.
Metrics → Count of admin-only routes hit by non-admins (should be 0), number of successful/bounced invite calls, rate of role-change operations, and incident count of RLS violations or 403s from guarded RPCs.
