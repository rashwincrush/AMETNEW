### 10. ARCHITECTURE & SRE REVIEW – STUDENT ROLE

**Bottlenecks / tight coupling**

- Student role rules currently live primarily in frontend components and hooks; backend and DB might not consistently encode the same rules.  
- Some modules (events, groups, mentorship) call Supabase directly from components rather than through a thin service/domain layer.

**Future modularity risks**

- Adding new roles (e.g., `faculty`) will require touching every `role === 'student'` check manually.  
- If multi-tenant support is expanded, student RLS must include tenant scoping on all tables.

**Autoscaling/logging gaps**

- Ensure Supabase function logs capture student-specific errors and misuse attempts (e.g., unauthorized inserts).  
- Centralize error logging for key RPCs (mentorship, messaging, group join) with structured context (role, user id, action).

**Cache invalidation**

- AuthContext refreshes profile and approval flags; this is good.  
- Ensure other modules (events, groups, directory) re-fetch when approval or role flags change, especially for long-lived sessions.

**Backup/restore**

- Student data (profiles, applications, mentorship relationships, messages) should be part of regular DB backups.  
- Restoration procedures must preserve RLS policies and role mappings to avoid accidentally widening student access after restore.

---

### 11. SECURITY / PRIVACY / COMPLIANCE AUDIT – STUDENT ROLE

**Access control**

- Students should have the narrowest permissions: primarily read-many, write-self, and constrained write to collaborative tables (groups, events RSVPs, mentorship).  
- Admin-only data (approval notes, rejection reasons) must not be visible to students.

**Data exposure**

- Directory and mentorship views must avoid exposing sensitive identifiers (student ID) to the public unless explicitly allowed.  
- Job and event views should show only necessary fields.

**Storage permissions**

- Any student-uploaded files (avatars, resumes) should live in private buckets with signed URLs; no direct public bucket writes from frontend.  
- Ensure bucket policies respect role and ownership.

**Token handling**

- JWTs must include accurate `role` and be refreshed on role/approval changes; avoid long-lived tokens with stale role info.  
- Logout must clear local storage and any cached profile data.

**Compliance (GDPR / India DPDP 2023)**

- Students are often minors/young adults; data minimization and retention policies must be explicit.  
- Provide clear, accessible privacy policy; allow students to request account deletion and data export, with backend support.  
- Avoid logging PII (emails, student IDs, phone numbers) in console or server logs beyond what’s strictly necessary.

**Retention & erasure**

- Define separate retention for student data vs. alumni/employer data.  
- Ensure account deletion/sanitization flows cascade appropriately to mentorship, messages, and applications without breaking referential integrity.

