# FRONTEND PRODUCT SPEC & ROLE CAPABILITY MATRIX (APPENDED)

## 1. Global Frontend Architecture & Concepts

### 1.1 App Type & Structure

- React SPA.
- Central auth & role context via `AuthContext`:
  - `currentUser` (+ profile).
  - `role` (e.g. `student`, `alumni`, `employer`, `admin`, `super_admin`).
  - Approval flags (pending/approved/rejected, mentorship eligibility, etc.).
  - `BASE_PERMISSIONS` and `derivePermissions()`.
- Routing & Guards:
  - `ProtectedRoute` with props like `requireAdmin`, `allowRoles`, `requiredPermission`, `isSuperAdminOnly`.
  - `AdminGate` for extra guarding of specific admin pages.
  - `RequireCompleteProfile` to enforce core identity completion.
  - `FeatureGuard` for module-level feature flags (e.g., messaging).
- Feature flags & tenants:
  - `TenantProvider` + tenant feature flags to enable/disable modules per tenant.

### 1.2 Roles & Approval States (Frontend View)

- Roles (frontend view): `student`, `alumni`, `employer`, `admin`, `super_admin`.
- Approval / status dimensions:
  - Account: `pending`, `approved`, `rejected` / `blocked`.
  - Mentorship: `approved-mentor`, `approved-mentee`, `not-eligible`.
  - Tenancy / feature flags: per-tenant modules on/off.
- These drive:
  - Which dashboard cards show.
  - Which CTAs appear (create/join/apply/request).
  - Whether modules are read-only vs interactive.

---

## 2. Route & Module Overview (Product Spec)

### 2.1 Registration (`/register` with `EnhancedRegister`)

- Two-step registration flow:
  - Step 1:
    - Select `primaryRole`: `student`, `alumni`, or `employer`.
    - Enter name, email, phone, password, accept terms.
  - Step 2:
    - Students: degree/department (via `useAcademicsCatalog`), `expected_graduation_year` (validated using `validateBatchYear`), optional `student_id`.
    - Alumni: degree, department, graduation year.
    - Employers: company details and job title.
- On submit:
  - Calls `supabase.auth.signUp` with profile metadata.
  - Seeds `profiles` and related tables (e.g., `social_links`).
  - Calls a role-alignment function so the session reflects the chosen role.
- UX:
  - Multi-step with Next/Back.
  - Inline validation and error toasts.
  - Blocks submission while catalogs are loading; surfaces clear toasts.

### 2.2 Login & Initial Access

- Login sets session; `AuthContext` loads profile, role, and approval flags.
- Initial redirect generally to `/dashboard`; rejected/blocked users go to `/rejection`.
- `ProtectedRoute`:
  - Redirects unauthenticated users away from protected pages.
  - Shows loading while checking auth & role.
- `RequireCompleteProfile`:
  - Ensures key profile fields are filled before unlocking some flows.

### 2.3 Dashboard (`/dashboard` – unified)

- Single dashboard component used for all roles.
- Panels commonly include:
  - Recent Activity (events, jobs, groups, mentorship, connections).
  - Upcoming events & "My Registrations".
  - Highlighted jobs.
  - Mentorship prompts (mentor/mentee states).
  - Quick links to directory and groups.
- UX rules:
  - New/pending users see prominent banners about email confirmation & approval status.
  - Approved users see focused CTAs (complete profile → connect → participate).

### 2.4 Profile Settings (`/profile`)

- One place to view/edit everything collected at registration plus optional extras.
- Fields by role:
  - Shared: name, phone, location, avatar, bio, social links, skills, interests.
  - Students: `expected_graduation_year`, `student_id`.
  - Alumni: graduation year, degree, department, current job & company.
  - Employers: company, position, employer-specific metadata.
- Behavior:
  - Only own profile is editable.
  - Role is not editable via profile UI.
  - Loading state while fetching; empty state if profile is missing.
- UX requirement: everything collected on registration must be visible/editable here.

### 2.5 Directory (`/directory`, `/profile/:id`)

- For students/alumni:
  - Searchable people directory.
  - Cards show 5 chips: Degree, Department, Batch/Grad year, Company, Position.
  - From a profile, CTAs may include connect, message, request mentorship.
- For employers:
  - Blocked from directory; see AccessDenied instead.
- Admin overlays:
  - Admins may see enriched counts/filters, but via same React components.
- UX:
  - Distinct empty states for:
    - No search results.
    - No connections yet.
    - No permission / not approved.

### 2.6 Events (`/events`, `/events/my-registrations`)

- Students:
  - Can view and register for events.
  - Cannot create events; "Create Event" CTA hidden (`canCreate` false).
- Alumni:
  - View/register; may create events depending on permissions.
- Employers:
  - Participate in employer-facing events; creation depends on configuration.
- UX:
  - Label events as "Alumni-only" or "Open" where relevant.
  - Surface friendly messages when users land on an event they cannot RSVP for.

### 2.7 Jobs (`/jobs`, job detail, /my-applications)

- Students & Alumni:
  - Consume jobs: browse, filter, and apply.
  - View "My Applications" for status tracking.
- Employers:
  - Create and manage job postings.
  - View applicants and application details.
- UX:
  - Deep links to `/jobs/:jobId/apply` must handle unauthenticated or pending users with clear login/approval guidance.
  - Differentiate between:
    - No jobs that match filters.
    - Not allowed to view jobs.

### 2.8 Groups (`/groups/*`)

- Students:
  - Browse groups.
  - Join non-alumni-only groups after approval.
  - Blocked from alumni-only groups; see clear toast.
  - Cannot create or moderate groups.
- Alumni:
  - Browse/join groups, including alumni-only.
  - Some alumni may be group admins with management UIs.
- Employers:
  - Redirected from `/groups/*` to `/events` with explanation.
- UX:
  - Badges for alumni-only groups.
  - Indicate member vs non-member vs admin roles on group detail.

### 2.9 Messaging (`/messages`)

- Feature gated with `FeatureGuard` and appropriate permissions.
- Provides conversation list and chat window for participants.
- Compose is disabled when conversation is closed or role disallows sending.
- UX:
  - First-time users see an empty-state message.
  - When blocked (e.g., rate-limited or recipient disallows), show explicit copy rather than generic error.

### 2.10 Mentorship (`/mentorship`)

- Hub with tabs/sections:
  - Browse mentors.
  - View/manage mentorship requests.
  - See active mentorship relationships.
  - Adjust mentorship settings.
- Students:
  - Mentees only; "Become a Mentor" hidden.
  - Must be approved mentees; blocked flows show banners explaining why.
- Alumni:
  - Can be mentors and/or mentees based on eligibility flags.
  - Manage mentor profiles and availability.
- UX:
  - Clear separation between mentor mode and mentee mode.
  - Strong messaging for pending/not-eligible cases.

### 2.11 Admin Panel (`/admin/*`)

- Admin (tenant-level):
  - `/admin/users` – user management and approvals.
  - `/admin/mentor-approvals` – mentor approvals.
  - `/admin/analytics`, `/admin/verify` – analytics and data verification.
- Super Admin (platform-level):
  - Above, plus `/admin/tenants` for tenant management and platform settings.
- All `/admin/*` routes:
  - Guarded by `ProtectedRoute requireAdmin` and often `AdminGate`.
  - Hidden from non-admin navigation.
  - Use consistent AccessDenied UX for blocked access.

