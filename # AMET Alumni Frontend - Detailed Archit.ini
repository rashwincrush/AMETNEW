### 12. FIX LIST: SHIP / DON’T SHIP GATE – STUDENT ROLE

**Must-fix before “Student flows are production-hard”**

1. **Centralize role logic**:  
   - Implement `useCurrentUserRole()` and `useStudentCapabilities()`; replace scattered `userRole === 'student'` logic in Events, Groups, Mentorship, etc.  
2. **Audit and harden RLS & RPCs**:  
   - For all student-related tables (profiles, group_members, event_rsvps, job_applications, mentorship_* tables, messaging), verify ownership and role filters.  
3. **Backend enforcement of student limits**:  
   - Disallow student event creation, alumni-only group membership, and mentor role assignment via DB-level constraints/policies.  
4. **Rate limiting and anti-spam**:  
   - Protect mentorship request endpoints, messaging, and group join RPCs from abusive student usage.  
5. **Consistent approval/eligibility surfaces**:  
   - Ensure a single source of truth for student approval + mentee eligibility, and wire that into all relevant UIs (groups, mentorship, jobs) with clear messages.

**Nice-to-have (post-hardening)**

- Enhanced onboarding checklists for students.  
- Better student-centric dashboards summarizing groups, events, jobs, and mentorship in one place.  
- Analytics dashboards for student engagement (for PM/founder usage).

**Ship/Don’t Ship Decision**

- **Don’t Ship as “fully hardened” yet** until RLS/RPC checks have been audited and role helpers centralized.  
- You can ship controlled pilots, but must monitor errors and abuse closely.

