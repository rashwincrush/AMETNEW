11. SECURITY / PRIVACY / COMPLIANCE AUDIT (FOCUSED ON ALUMNI)

- **Access Control**: Alumni data must be visible to (a) self, (b) approved peers in same tenant, (c) admins; never world-readable beyond intended directory rules.  
- **Data Exposure**: Ensure directory views expose only allowed fields and avoid sensitive data (emails optional, phone default-hidden).  
