  See: Alumni case studies, funnels, and metrics depend on accurate tracking of Alumni role flows.  
  Breaks: If Alumni are mis-labeled (e.g., left as `user` or `student`), pipeline data is wrong.  
  Concerns: Hard to segment emails/campaigns for Alumni mentors, jobseekers, and event participants.  
