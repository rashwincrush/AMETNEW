## Student Role – OPIB-∞ Audit (Frontend & Flows)

---

### 0. 10-LINE EXECUTIVE SUMMARY (CEO)

1. **Problem** → Student flows touch every module (registration, profile, approvals, directory, groups, events, jobs, messaging, mentorship), but rules and protections must be consistent and secure.
2. **Users** → Current students, approvers/admins, and external parties interacting with students (alumni, employers, mentors).
3. **Need** → Clear boundaries: what students can see/do vs. alumni/employers/admins, including approval gates and mentorship eligibility.
4. **Why Now** → Role logic has grown organically; differences between frontend guards and backend/RLS can cause leaks, broken UX, or security gaps.
5. **Solution** → Normalize Student role behavior across all modules with explicit rules, shared helpers, and DB-backed enforcement (Supabase + RLS + RPCs).
6. **Architecture** → Single source of truth in `public.profiles.role` + approval flags, used consistently in AuthContext, hooks, and module-level permission checks.
7. **Value** → A coherent student experience (smooth registration → profile → participation) with strong guardrails against misuse and accidental exposure.
8. **Risks** → Frontend-only restrictions, inconsistent defaults (e.g., missing role defaulting to `student`), and partial approval logic in specific modules.
9. **Metrics** → Time-to-first-action for new students, approval throughput, error/rejection rates, unauthorized-action attempts, and mentorship engagement by students.
10. **Next Steps** → Implement shared role/approval helpers, align each module with them, and harden DB/RLS and RPCs so frontend is never the only gate.

