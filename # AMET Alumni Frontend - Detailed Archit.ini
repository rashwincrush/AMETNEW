## 4. Role‑Specific Frontend Specs (Flows & UX)

### 4.1 Student Role – Frontend & UX

- Registration:
  - Select `student` role; supply academic info and validated grad year.
  - Clear validation and blocking while catalogs are loading.
- Profile:
  - Student-specific fields (`expected_graduation_year`, `student_id`) are visible and editable.
  - Other profile fields mirror alumni where relevant.
- Access rules (frontend expectation):
  - Cannot create events, alumni-only groups, or become mentors.
  - Cannot access admin or tenant management.
  - Can browse directory, join eligible groups, RSVP to events, apply for jobs, request mentorship (as mentee), and use messaging where feature flags/permissions allow.
- UX messaging:
  - Toasters/banners for alumni-only groups or blocked event creation.
  - Dashboard/profile show approval status and next steps for pending or blocked students.

### 4.2 Alumni Role – Frontend & UX

- Core JTBD:
  - Register and prove identity, maintain a rich profile, explore/apply jobs, attend events, join groups, mentor or be mentored, and message safely.
- Flows:
  - Registration as alumni, followed by dashboard experience.
  - May act as mentee, mentor, or both depending on eligibility flags.
- Access rules:
  - Can see full directory (within tenant & privacy), jobs, groups (including alumni-only), events, mentorship, and messaging.
  - Cannot self-elevate to admin/employer or access admin/tenant panels.
- UX emphasis:
  - Strong surfacing of approval state and mentorship eligibility.
  - Clear labels like "Alumni-only" on groups/events.

### 4.3 Employer Role – Frontend & UX

- High-level:
  - Register as employer; manage job postings and relevant events.
- Access:
  - Jobs: post and manage.
  - Events: attend or host as configured.
  - Groups: not available; redirects to events.
  - Directory: typically blocked to avoid raw candidate scraping.
- UX:
  - Clear explanation when redirected away from groups or directory.

### 4.4 Admin & Super Admin – Frontend & UX

- Admin:
  - Sees admin nav items when `isAdminLike` / `requireAdmin` is satisfied.
  - Uses `/admin/users`, `/admin/mentor-approvals`, `/admin/analytics`, `/admin/verify` for tenant-level controls.
- Super Admin:
  - All admin capabilities plus `/admin/tenants` and platform settings.
- UX:
  - Clearly differentiate tenant-level vs platform-level actions.
  - Strong confirmations for dangerous changes (roles, deletions, tenant edits).
  - Consistent AccessDenied for non-admins who hit admin URLs.

---

## 5. Frontend‑Side Improvement Themes

- Centralize role logic:
  - Implement hooks like `useCurrentUserRole()` and role capability hooks.
  - Replace scattered `role === 'student'` checks with these helpers.
- Standardize AccessDenied UX:
  - Dedicated component for role, approval, and feature-flag denials.
  - Distinct from empty-state and technical error views.
- Improve approval and eligibility visibility:
  - Banners on dashboard/profile for account approval and mentorship eligibility.
  - Consistent messaging when actions are blocked.
- Refine loading/empty/error states:
  - Directory, jobs, events, and mentorship should differentiate between "nothing here", "no access", and "error".
- Navigation clarity:
  - Nav reflects role and feature flags to avoid dead links and surprise 403s.

