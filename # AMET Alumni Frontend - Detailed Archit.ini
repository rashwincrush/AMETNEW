### 8. SECURITY & ABUSE ANALYSIS – STUDENT ROLE

**Top threats**

1. **IDOR / RLS bypass**: Student passing someone else’s `id` / `mentee_id` / `user_id` into APIs to edit profiles, join groups, send mentorship requests, or read messages.  
2. **Role escalation**: Student modifying payloads to set `role = 'alumni'` or `role = 'admin'` on profile or sign-up metadata.  
3. **Abuse / spam**: Students mass-sending mentorship requests or messages, or joining/leaving groups excessively.  
4. **Data leakage**: Students viewing alumni-only or employer-only events/groups/jobs or seeing internal metadata (e.g., approval reasons).  
5. **Weak validation**: Inconsistent validation between FE and DB (e.g., expected grad year accepted by DB but rejected by FE, or vice versa).

**Mitigations**

- Enforce strict RLS for all student-related tables, using `auth.uid()` and role checks.  
- Disallow role changes from client payloads; manage `role` only via secure admin flows or controlled RPCs.  
- Add rate limits on key RPCs (mentorship requests, messaging, group joins, job applications).  
- Use views and RLS to hide sensitive alumni-only/employer-only data from students.  
- Mirror FE validation in DB constraints and/or in RPC input checks.

**Early warning signals**

- Spikes in mentorship requests/messages from a single student account or IP.  
- 403/401 rates increasing for student actions, indicating probing or misconfigurations.  
- Unexpected counts of students in alumni-only resources.

**Auth/session/token pitfalls**

- Ensure JWT includes accurate `role` and approval flags from secure backend, refreshed after admin role/approval changes (`set-role` + `auth.refreshSession`).  
- Never trust localStorage-only role flags; always cross-check with server when performing sensitive ops.

