### 9. QA / SDET EDGE CASE SWEEP – STUDENT ROLE

Test Student flows for at least the following scenarios:

- **New Student (unapproved)**  
  - Registration success, email confirmed, but `approval_status = 'pending'`.  
  - Can browse read-only content (directory, public events, public groups) but cannot join or request mentorship; receives clear banners.

- **Approved Student**  
  - Can join non-alumni-only groups, RSVP to eligible events, apply for jobs, and request mentors (if mentee-approved).  
  - Cannot create events or groups reserved for alumni/employers.

- **Blocked / Rejected Student**  
  - Confirm they are redirected appropriately (`/rejection` screen) and lose write access (groups/jobs/events/mentorship).  
  - Ensure messaging/legacy data is handled correctly (read-only or fully blocked per policy).

- **Student role-changes**  
  - Student → Alumni (post-graduation): verify batch year and expected grad year transitions and updated capabilities (mentorship, alumni-only groups).  
  - Student → Employer (rare but possible): ensure orphaned data is handled and capabilities switch cleanly.

- **Technical edges**  
  - Mobile viewport; slow network; Supabase outages; expired JWT; refresh failures.  
  - Student creating mentorship requests exactly when mentor or student eligibility changes.

- **Crash loops / offline presence**  
  - Confirm no infinite redirect loops for blocked/pending students.  
  - Green/online presence dots must not rely solely on FE state when role changes.

