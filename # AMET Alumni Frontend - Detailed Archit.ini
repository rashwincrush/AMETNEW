  Concerns: IDOR in profile/mentorship/messaging, XSS via rich text or user-generated content, and unthrottled operations (spamming requests/messages).  
  Must-not-fail: No Alumni-level feature can be used to enumerate user data or perform mass scraping/spam without rate limits and monitoring.

- **DevOps/SRE**  
  See: Supabase as DB+auth, React frontend, serverless functions, and multi-tenant config via `supabase/config.toml`.  
  Breaks: Spikes in Alumni actions (signups for a large batch year; mass event RSVPs) can overload RPCs, logs, or realtime subscriptions.  
  Concerns: Lack of logging on high-risk Alumni operations (role changes, mentorship accept/reject, bulk messaging) and no clear backup/restore playbook per tenant.  
  Must-not-fail: No data loss in Alumni relationships or messages; incidents must be diagnosable with logs that don’t leak PII.

- **Support/Success**  
  See: Admin panels (user management, mentor approvals, tenant management) and per-user views.  
  Breaks: If support cannot quickly see “why this Alumni cannot access mentorship/jobs/directory”, support load spikes and response quality degrades.  
  Concerns: Lack of single place showing role, approval status, and feature flags per Alumni.  
