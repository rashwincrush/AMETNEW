### 3. PRODUCT MANAGER (PM) LOGIC MAP – STUDENT ROLE

**Key rules for Students**

- **Registration**  
  - Can choose `primaryRole = 'student'` in `EnhancedRegister`.  
  - Must provide: name, email, phone, password, degree, department, expected graduation year (validated with `validateBatchYear`), and accept terms.  
  - Student-specific fields: `expected_graduation_year`, `student_id` (optional but important for identity).  
  - Saved to `auth` + `public.profiles` (`role = 'student'`), with email confirmation + profile upsert.

- **Profile Settings**  
  - Can view/edit own core fields: names, contact, degree, department, expected grad year, student ID, location, social links, skills, interests.  
  - Writing uses `.update` on `public.profiles` for the current user only.  
  - No ability to change `role` to alumni/employer from UI.

- **User Management (Admin)**  
  - Admins can approve/block student accounts (e.g., `approval_status`, `is_approved`).  
  - Admin can update mentorship eligibility flags (mentee/mentor approvals) and potentially convert students to alumni post-graduation.

- **Directory**  
  - Students appear as people in the network with limited chips: Degree, Department, Batch (expected grad year), Company (if any), Position.  
  - Students can search/browse others, subject to RLS and privacy rules.

- **Events**  
  - Students can view and register for events, but **cannot create** events (`canCreate = hasPermission('events:create') && userRole !== 'student'`).  
  - Alumni-only or invite-only event types should restrict student visibility based on backend filters.

- **Job Portal**  
  - Students are primary consumers: can browse/apply for jobs (logic not fully inspected here but assumed).  
  - Cannot post jobs as employers; any create/update must be blocked or require employer role.

- **Groups**  
  - Students can browse groups.  
  - Cannot join groups tagged `alumni-only` (`blockedForStudent` in `GroupsList` and `GroupDetail`).  
  - Must be approved users before joining (`isUserApproved`).  
  - Cannot manage or moderate groups without admin/group-admin status.

- **Messaging**  
  - Students can engage in direct messaging with mentors, alumni, and potentially employers once relationships/requests exist.  
  - Messaging uses conversation tables + RPCs; access must be limited to participants.

- **Mentorship**  
  - Students are **mentees only** (registration resets `mentorshipRole` to a valid set; for students only `'mentee'`).  
  - Cannot see “Become a Mentor” button when `getUserRole().toLowerCase() === 'student'`.  
  - Must be approved mentees (`ApprovedGuard require="approved-mentee"`) to use mentorship flows.  
  - Can request mentorship from approved mentors via RPC-based mutations.

**Student JTBD (Jobs To Be Done)**

- Discover and join relevant groups (non-alumni-only) to integrate with the community.  
- Attend events and workshops relevant to students.  
- Build a rich profile and be discoverable for mentorship and jobs.  
- Request, manage, and maintain mentorship relationships.  
- Communicate with mentors, alumni, and peers via messaging.

**Success / Failure Definition**

- **Success**  
  - Student registers, confirms email, and is approved within a defined SLA.  
  - They can immediately browse directory, view events/groups, and request mentors as soon as approval and eligibility conditions are met.  
  - They never encounter unexplained blocks; all restrictions show clear reasoning and next steps.

- **Failure**  
  - Student stuck in limbo: registration succeeded but they cannot perform any meaningful action with poor feedback.  
  - Student can see/act on alumni-only or admin-only resources.  
  - Student impersonates others via IDOR/RLS gaps or can spam requests/messages unchecked.

**Constraints (Must / Should / Could)**

| Priority | Constraint                                                                                   |
|----------|----------------------------------------------------------------------------------------------|
| **MUST** | Students cannot create events, alumni-only groups, or admin-level configurations.           |
| **MUST** | Students cannot become mentors; they can only be mentees (until explicitly upgraded).       |
| **MUST** | All student writes are bound to `auth.uid()` and subject to approval and RLS.                |
| **MUST** | Alumni-only tags and approvals must be enforced in DB/RPC, not just UI.                     |
| **SHOULD** | Provide consistent banners/tooltips when students are blocked from actions.              |
| **SHOULD** | Expose clear approval status in dashboard for students.                                  |
| **COULD** | Add student onboarding checklists and progress indicators (profile completeness, etc.).    |

