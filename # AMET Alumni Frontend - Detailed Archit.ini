### 1. MULTI-PERSONA DEEP SCAN (14+ LENSES)

- **Student (primary persona)**  
  - **Sees**: Registration form (Student role), Profile Settings (expected grad year, student ID), directory, groups, events listing, messaging, mentorship (as mentee only).  
  - **Breaks**: Attempts to join alumni-only groups, create events, become a mentor, or perform admin actions. UX must explain *why*, not just fail silently.  
  - **Concerns**: Account approval delays, unclear eligibility (e.g., mentee vs mentor), hidden capabilities (e.g., “Why can’t I see/create X?”).  
  - **Must-not-fail**: Cannot accidentally be treated as alumni/employer; cannot bypass approvals; cannot edit others’ data; must see accurate mentorship & group eligibility.

- **Alumni**  
  - **Sees**: Students in directory and mentorship (as mentees), may interact via groups, events, messaging.  
  - **Breaks**: If students appear where they shouldn’t (alumni-only groups, alumni-only events) or if student markers are missing.  
  - **Must-not-fail**: Alumni-only spaces must remain alumni-only, even if frontend conditions are bypassed.

- **Employer**  
  - **Sees**: Students as potential candidates in directory, jobs module, maybe events.  
  - **Concerns**: Accurate, clean student data (degree, expected graduation, skills) and no leakage of sensitive identifiers beyond what’s allowed.  
  - **Must-not-fail**: Cannot see hidden student-only details; cannot act as student in flows (mentee-only actions, student-only approvals).

- **Admin / Super Admin**  
  - **Sees**: User management (approval_status, role changes), flags for mentorship eligibility, group/event moderation screens.  
  - **Breaks**: If changing roles from/to `student` leads to orphan approval state, broken mentorship eligibility, or leftover memberships.  
  - **Must-not-fail**: Guardrails against removing the last super_admin; clear flows to approve/block students; no partial state when demoting/promoting roles.

- **Product Manager**  
  - **Sees**: Multiple modules interpreting `student` differently (e.g., blocked from events create, blocked from alumni-only groups, restricted mentorship role).  
  - **Concerns**: Fragmented rules, risk of inconsistent experiences, and untracked edge cases (pending-approval students, blocked users).  
  - **Must-not-fail**: One canonical set of student capabilities, documented and tested across modules.

- **UX Designer / UX Writer**  
  - **Sees**: Various banners and messages (e.g., mentorship eligibility, group join errors, event creation disabled).  
  - **Concerns**: Mixed language, missing explanations when a CTA is hidden vs. disabled, no guidance during approval waiting.  
  - **Must-not-fail**: Students must always know *what to do next* and *why* something is blocked.

- **Frontend Lead**  
  - **Sees**: Role checks via `getUserRole()`, `useAuth()`, `useMentorshipRoleContext`, and hard-coded `userRole !== 'student'` conditions (e.g., Events, Groups, Mentorship).  
  - **Concerns**: Drift between modules, missing shared role/approval helpers, risk of “role === 'student'” scattered everywhere.  
  - **Must-not-fail**: Centralized role utilities and approval hooks, no direct `.update()` that could cross tenants or roles.

- **Backend/API Lead**  
  - **Sees**: Supabase RPCs (`get_mentors_for_current_mentee`, `set-role`, messaging helpers) plus table-level RLS.  
  - **Concerns**: Frontend-only role guards for creates/updates, incomplete checks in RPCs, inconsistent use of `auth.uid()` vs. client-supplied IDs.  
  - **Must-not-fail**: Every insert/update/delete that affects student-related actions must be RLS/RPC-guarded by role + ownership.

- **DB/Supabase Architect**  
  - **Sees**: `public.profiles.role`, `expected_graduation_year`, `student_id`, mentorship tables, groups, events, jobs.  
  - **Concerns**: NOT NULL / FK gaps, missing unique constraints (e.g., duplicate student IDs), and incomplete RLS on student-facing tables.  
  - **Must-not-fail**: Correct tenant/role filters; student rows never exposed beyond intended audiences.

- **RLS/Security Engineer**  
  - **Sees**: RLS policies for `profiles`, groups, events, jobs, messaging, mentorship tables and RPC functions.  
  - **Concerns**: IDOR via profile IDs, event/group membership bypasses, mentorship requests created with arbitrary mentee IDs.  
  - **Must-not-fail**: All student-related operations tie to `auth.uid()` and role-appropriate rules; no way to impersonate another student.

- **QA / SDET**  
  - **Sees**: Edge cases like pending-approval students, blocked students, role-changed users, mobile, slow network, expired tokens.  
  - **Concerns**: Inconsistent UX (some modules respect approval, others not), error states that don’t surface API failures.  
  - **Must-not-fail**: Comprehensive scenario coverage for student journeys across all modules.

- **DevOps / SRE**  
  - **Sees**: Logs, rate limiting, and failure modes of Supabase functions and frontend.  
  - **Concerns**: Student-driven DoS through spammy actions (mentorship requests, messaging, group joins), poor error logging on RLS/RPC failures.  
  - **Must-not-fail**: Bound workloads and good observability for student-heavy usage.

- **Support / Success**  
  - **Sees**: Student tickets (“can’t join group”, “can’t request mentors”, “profile not approved”).  
  - **Concerns**: Hard-to-diagnose states when UI and backend disagree (e.g., UI says mentee not approved but DB says approved).  
  - **Must-not-fail**: Clear admin dashboards + logs so issues can be diagnosed and resolved quickly.

- **Sales/Marketing / Founder Mode**  
  - **Sees**: Student activation is a key driver for future alumni engagement and employer interest.  
  - **Concerns**: Overly strict rules can block students; overly lax rules can hurt trust and compliance.  
  - **Must-not-fail**: Strike a balance that grows student engagement safely.

