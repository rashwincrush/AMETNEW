### 4. UX/UI AUDIT – STUDENT FLOWS

**User journeys**

1. **Registration as Student** → Email/password + profile details → Email confirmation → Redirect → Student dashboard/profile.  
2. **Profile Completion** → Students land on Profile page or ProfileCompletion → Fill missing expected grad year, student ID, etc.  
3. **Exploration** → Directory → Events → Groups → Mentorship → Messaging.  
4. **Mentorship** → View mentors → Send request → Track status → Chat after acceptance.

**Flow drop-offs / UX risks**

- If catalog (`useAcademicsCatalog`) is still loading and user tries to submit, they get a toast and cannot proceed; good, but ensure skeleton/loading states are clearly visible.  
- Students may try to join alumni-only groups and see toast/errors; that’s good, but more proactive labeling (“Alumni-only”) in cards would reduce confusion.  
- Mentorship uses banners explaining eligibility, but relies on `mentorshipEligibility`; ensure this is consistently up-to-date with backend flags.

**Navigation & CTAs**

- `EnhancedRegister` uses a two-step flow; back/next work correctly with validation.  
- Events: “Create” CTA hidden for students (`canCreate && userRole !== 'student'`); this silently removes capability without explicit explanation anywhere.  
- Groups: Join/Leave logic is explicit; alumni-only checks show clear toasts for students.  
- Mentorship: “Become a Mentor” hidden for students; there is no explicit message saying “Students are mentees only,” which may be acceptable but could confuse advanced students.

**UI state completeness**

- Registration: Validation errors toasts and field-level messages exist, but consider inline hints for student-specific fields (expected_graduation_year, student_id).  
- Profile: Uses `isComponentLoading` and renders empty state when no profile; ensure student-specific fields (expected grad year, student ID) are visible/editable.  
- Mentorship: Nice handling of loading, error, empty, and retry states when fetching mentors and requests.  
- Groups/Events: Provide empty states when no groups/events rather than blank screens.

**Cognitive load & accessibility**

- Registration form is large; splitting into two steps helps.  
- Ensure labels/inputs meet WCAG color contrast and all CTAs are keyboard-accessible.  
- Error toasts are transient; important blockers (approval pending, alumni-only) should also be represented in persistent UI sections.

**Mobile-first**

- Many layouts use responsive classes (`grid-cols-1 lg:grid-cols-2`, flex-col vs flex-row).  
- Need explicit checks on smallest viewports: ensure student-specific badges (role, approval, “alumni-only”) are visible and not clipped.

---

### 5. FRONTEND ENGINEERING AUDIT – STUDENT ROLE

**Role & approval handling**

- `EnhancedRegister` maintains `primaryRole` and validates student-specific fields via `validateBatchYear` and DB-backed degree/department checks.  
- `ProfileCompletion.jsx` writes `expected_graduation_year` and `student_id` only when `role === 'student'`.  
- Groups use `userRole === 'student'` checks to block alumni-only groups.  
- Events use `userRole !== 'student'` to compute `canCreate`.  
- Mentorship hides “Become a Mentor” when role is student.

**Gaps / Risks**

- **Scattered student role checks**:  
  - Many components manually check `userRole === 'student'` or lowercased role strings.  
  - Risk: If role naming or mapping changes, some modules will break silently.

- **Potential inconsistent default role**:  
  - A snippet in `AuthContext` logs `const role = profile.role || 'student'` for logging; other memories indicate default `alumni` elsewhere.  
  - Risk: Inconsistent implied role for users with null `role` in DB.

- **Direct `.update()` usage** (Profile, ProfileCompletion):  
  - FE restricts to `eq('id', user.id)`, which is correct locally but still requires RLS to enforce at DB level.  
  - Any future refactor or bug in `user.id` retrieval could cause surprising behavior if RLS is weak.

**Realtime / staleness**

- Mentorship subscribes to `profiles.is_available_for_mentorship` changes and refetches mentors; good.  
- AuthContext subscribes to profile changes for the current user; role and approval flags auto-update.  
- Need equivalent consistency for event/group eligibility when approval flags change (e.g., if admin approves a student while they are on the Groups screen).

**UI state coverage**

- Registration/mentorship/groups/events mostly handle loading/error/empty states.  
- Ensure that when RLS or RPC returns 403/401, frontend shows a clear message rather than generic “Failed to load”.

**Recommended FE changes**

1. Introduce `useCurrentUserRole()` and `useStudentCapabilities()` hooks exposing:  
   - `isStudent`, `isAlumni`, `isEmployer`, `isAdminLike`.  
   - `canCreateEvents`, `canJoinGroup`, `canRequestMentorship`, `canBecomeMentor`, `isApprovedStudent`, etc.  
   - Replace direct `role === 'student'` with these helpers everywhere.
2. Standardize student-specific banners via a shared component (e.g., `StudentEligibilityBanner`) that can show: approval waiting, mentee eligibility, alumni-only constraints.  
3. Wrap direct Supabase `.update()` / `.upsert()` calls in typed service functions (e.g., `updateMyProfile`) that always use `user.id` and enforce safe payload shapes.

