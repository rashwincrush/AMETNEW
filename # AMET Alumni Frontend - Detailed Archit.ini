## 12. Development Guidelines

### 🏗️ Component Development Standards

#### Component Structure Template
```jsx
// Component template with best practices
import React, { useState, useEffect, useMemo } from 'react';
import { useQuery } from '@tanstack/react-query';
import { toast } from 'react-hot-toast';

/**
 * ComponentName - Brief description of component purpose
 * 
 * @param {Object} props - Component props
 * @param {string} props.title - The title to display
 * @param {Function} props.onAction - Callback for action button
 * @param {boolean} props.loading - Loading state
 * @param {string} props.className - Additional CSS classes
 */
const ComponentName = ({ 
  title, 
  onAction, 
  loading = false, 
  className = '' 
}) => {
  // State hooks
  const [localState, setLocalState] = useState(null);
  
  // Data fetching
  const { data, error, isLoading } = useQuery({
    queryKey: ['component-data', title],
    queryFn: () => fetchComponentData(title),
    enabled: !!title
  });
  
  // Computed values
  const computedValue = useMemo(() => {
    return data ? process(data) : null;
  }, [data]);
  
  // Side effects
  useEffect(() => {
    if (error) {
      toast.error('Failed to load component data');
    }
  }, [error]);
  
  // Event handlers
  const handleAction = useCallback(() => {
    if (onAction) {
      onAction(localState);
    }
  }, [onAction, localState]);
  
  // Render
  if (isLoading || loading) {
    return <ComponentSkeleton />;
  }
  
  if (error) {
    return <ErrorMessage error={error} />;
  }
  
  return (
    <div className={`component-base ${className}`}>
      <h2 className="text-xl font-semibold mb-4">{title}</h2>
      <div className="component-content">
        {computedValue && (
          <div>{computedValue}</div>
        )}
      </div>
      <button 
        onClick={handleAction}
        className="mt-4 px-4 py-2 bg-primary-600 text-white rounded"
      >
        Action
      </button>
    </div>
  );
};

export default ComponentName;
```

#### Hook Development Pattern
```javascript
// Custom hook template
const useCustomHook = (dependency) => {
  const [state, setState] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  
  useEffect(() => {
    if (!dependency) return;
    
    let isMounted = true;
    
    const fetchData = async () => {
      try {
        setLoading(true);
        setError(null);
        
        const result = await apiCall(dependency);
        
        if (isMounted) {
          setState(result);
        }
      } catch (err) {
        if (isMounted) {
          setError(err);
        }
      } finally {
        if (isMounted) {
          setLoading(false);
        }
      }
    };
    
    fetchData();
    
    return () => {
      isMounted = false;
    };
  }, [dependency]);
  
  return {
    data: state,
    loading,
    error,
    refetch: () => fetchData()
  };
};
```

