### 7. DATABASE + SUPABASE RLS SCAN – STUDENT ROLE (ASSUMPTIVE CHECKLIST)

**Key student-related fields and tables**

- `public.profiles`  
  - `role` (should include `'student'`), `expected_graduation_year`, `student_id`, `approval_status`, `is_approved`.  
  - RLS: users should only be able to `SELECT`/`UPDATE` their own profile (`id = auth.uid()`), with admins having broader access.

- **Groups** (`groups`, `group_members`)  
  - Columns like `tags` (with `alumni-only`), `is_private`, `is_approved`, `is_archived`.  
  - RLS must prevent student inserts into alumni-only groups, even if FE is bypassed.

- **Events** (`events`, `event_rsvps`)  
  - RLS should:  
    - Forbid `INSERT` on `events` by students.  
    - Allow `INSERT` on `event_rsvps` for students only for visible/eligible events.

- **Jobs** (`jobs`, `job_applications`)  
  - Students should only `INSERT` into `job_applications` for open jobs and only once per job.  
  - RLS + unique indexes should enforce this.

- **Messaging** (`conversations`, `conversation_participants`, `messages`)  
  - Students must only see messages for conversations where they are participants.  
  - RLS filters must reference `auth.uid()` and join participant tables appropriately.

- **Mentorship** (`mentorship_requests`, `mentorship_relationships`, `mentors` or equivalent view)  
  - RLS: students as mentees can only see their own requests, not others’.  
  - Mentors see mentee details only for their own requests/relationships.

**RLS / constraint gaps to check**

- **NOT NULL**  
  - Ensure required fields for identification (e.g., `email` on profiles) are NOT NULL; `student_id` may be nullable but, if used formally, should be unique where present.

- **FK integrity**  
  - All `*_id` columns referencing `profiles.id` must be FK-constrained to avoid orphaned data when a student is deleted.

- **UNIQUE constraints**  
  - Consider `UNIQUE (student_id)` where present and validated.  
  - `job_applications` likely needs `UNIQUE (job_id, applicant_id)`; mentorship requests likely need uniqueness over `(mentor_id, mentee_id, status IN ('pending', 'accepted'))`.

- **CHECK constraints**  
  - Enforce expected ranges for `expected_graduation_year` in DB, consistent with `validateBatchYear` logic (e.g., not 1900 or 9999).  
  - Valid `role` values via enum or CHECK constraint including `'student'`.

- **RLS bypasses / ownership**  
  - Policies must never trust client-supplied `user_id` or `mentee_id` alone; they should always combine with `auth.uid()`.  
  - For read-only views (like mentors listing), RLS can be relaxed but must not leak sensitive student details.

- **Last super_admin safeguard**  
  - When changing roles (student ↔ alumni ↔ admin), ensure no path accidentally demotes the last `super_admin`.

